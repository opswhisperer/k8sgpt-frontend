apiVersion: v1
kind: Service
metadata:
  name: k8sgpt-frontend
  labels:
    app.kubernetes.io/name: k8sgpt-frontend
spec:
  selector:
    app.kubernetes.io/name: k8sgpt-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
    # Metrics have no auth: keep this port off any public route.
    - name: metrics
      port: 9090
      targetPort: metrics
