# Example overlay: k8sgpt-frontend behind an Istio Gateway with a cert-manager
# certificate, configured from settings.env (kept out of git).
#   cp settings.env.example settings.env   # then edit it
#   kubectl apply -k deploy/examples/istio-gateway
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8sgpt-operator-system

resources:
  - ../../base
  - gateway.yaml

# Every key in settings.env becomes an environment variable of the frontend
# (INGRESS_HOSTNAME, IMAGE and CERT_ISSUER are only used below).
configMapGenerator:
  - name: k8sgpt-frontend-settings
    envs:
      - settings.env

replacements:
  - source:
      kind: ConfigMap
      name: k8sgpt-frontend-settings
      fieldPath: data.INGRESS_HOSTNAME
    targets:
      - select:
          kind: Certificate
          name: k8sgpt-frontend-cert
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: Gateway
          name: k8sgpt-frontend-gateway
        fieldPaths:
          - spec.listeners.0.hostname
          - spec.listeners.1.hostname
      - select:
          kind: HTTPRoute
        fieldPaths:
          - spec.hostnames.0
  - source:
      kind: ConfigMap
      name: k8sgpt-frontend-settings
      fieldPath: data.CERT_ISSUER
    targets:
      - select:
          kind: Certificate
          name: k8sgpt-frontend-cert
        fieldPaths:
          - spec.issuerRef.name
  - source:
      kind: ConfigMap
      name: k8sgpt-frontend-settings
      fieldPath: data.IMAGE
    targets:
      - select:
          kind: Deployment
          name: k8sgpt-frontend
        fieldPaths:
          - spec.template.spec.containers.0.image
